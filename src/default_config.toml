# diskbytype built-in categories.
#
# Print this file with `diskbytype --dump-config`. Put your own rules in
# ~/.config/diskbytype/config.toml (or pass --config): a [[category]] with an
# existing name extends it, a new name adds a category.
#
# Fields:
#   name        label shown in the UI
#   icon        emoji shown with `icons = "emoji"` (default)
#   nerd_icon   Nerd Font glyph shown with `icons = "nerd"`
#   color       256-color index (0-255) or "#rrggbb"
#   extensions  file extensions, case-insensitive, without the dot
#   dirs        directory names; everything below counts toward the category.
#               "parent/name" only matches `name` directly inside `parent`.
#   markers     a directory containing this entry counts toward the category.
#               "dirname/marker" only matches directories called `dirname`.
#   weak        a more specific category found inside overrides this one
#
# Top-level `icons` picks the icon set: "emoji" (default), "nerd" (needs a
# Nerd Font, https://www.nerdfonts.com) or "none". `--icons` overrides it.
#
# Directory rules beat extensions: a .js file inside node_modules counts as
# node_modules, a .pdf inside .Trash counts as Trash.

# --- Directories -----------------------------------------------------------

[[category]]
name = "node_modules"
icon = "📦"
nerd_icon = "\uE718"
color = 203
dirs = ["node_modules", "bower_components", "jspm_packages"]

[[category]]
name = "Python env"
icon = "🐍"
nerd_icon = "\uE73C"
color = 214
dirs = ["__pypackages__", ".tox", ".nox"]
markers = ["pyvenv.cfg", "conda-meta"]

[[category]]
name = "Python cache"
icon = "🧹"
nerd_icon = "\uF12D"
color = 180
dirs = [
  "__pycache__", ".pytest_cache", ".mypy_cache", ".ruff_cache", ".ipynb_checkpoints",
  ".hypothesis", ".pyre", ".pytype",
]

[[category]]
name = "ML cache"
icon = "🧠"
nerd_icon = "\uF0E7"
color = 205
dirs = [
  "huggingface", "kagglehub", ".cache/torch", ".cache/whisper", ".keras", ".ollama/models",
  ".lmstudio/models", "wandb", "lightning_logs", "mlruns",
]

[[category]]
name = ".git / VCS"
icon = "🌿"
nerd_icon = "\uF1D3"
color = 166
dirs = [".git", ".hg", ".svn", ".jj", ".bzr"]

[[category]]
name = "Build output"
icon = "🔨"
nerd_icon = "\uF0AD"
color = 170
dirs = [
  ".next", ".nuxt", ".turbo", ".parcel-cache", ".svelte-kit", ".angular", ".dart_tool",
  ".expo", ".vercel", ".docusaurus", "DerivedData", "CMakeFiles", ".build", "zig-cache",
  ".zig-cache", "zig-out", ".nx", ".output",
]
# Cargo writes CACHEDIR.TAG into target/.
markers = ["target/CACHEDIR.TAG"]

[[category]]
name = "Package cache"
icon = "📥"
nerd_icon = "\uF019"
color = 137
dirs = [
  ".npm", ".pnpm-store", ".yarn/cache", ".bun/install", ".gradle", ".m2", ".nuget", ".ivy2",
  ".sbt", ".pub-cache", ".cpan", ".conan", ".conan2", ".terraform", ".cargo/registry",
  ".cargo/git", "pkg/mod", ".cache/pip", ".cache/uv", ".cache/pypoetry", "Caches/pip",
  "Caches/Homebrew", "Caches/Yarn", "Caches/pnpm", "Caches/CocoaPods", "Pods",
]

[[category]]
name = "Cache"
icon = "💾"
nerd_icon = "\uF1DA"
color = 139
weak = true
dirs = [".cache", "Caches", "Cache", "CachedData", "GPUCache", "Code Cache", "ShaderCache"]
markers = ["CACHEDIR.TAG"]

[[category]]
name = "Trash"
icon = "🚮"
nerd_icon = "\uF1F8"
color = 240
dirs = [".Trash", ".Trashes", "$RECYCLE.BIN", "share/Trash"]

